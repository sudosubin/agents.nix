name: Codex Marketplaces Fetch

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: codex-marketplaces
      sites: '["github-code", "github-topics"]'
    secrets: inherit
