name: Sources

# Every kind collects its sources this way: each site is scanned, the new
# repositories are qualified by stars, and the merged list lands through a
# pull request. A `<kind>-fetch.yml` is only the schedule that calls this.

on:
  workflow_call:
    inputs:
      kind:
        description: The directory under data/ whose sources.json to update.
        required: true
        type: string
      sites:
        description: The sites `<kind>-scan.py` knows, as a JSON array.
        required: true
        type: string
      data:
        description: Committed data a scan reads, as directories under data/.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # GitHub search is rate limited per token, and every scan here shares one
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(inputs.sites) }}
    env:
      KIND: ${{ inputs.kind }}
      SITE: ${{ matrix.site }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ci
            ${{ inputs.data }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/${{ inputs.kind }}-scan.py

      - name: scan the site
        run: uv run --script "ci/scripts/$KIND-scan.py" "$SITE" "scans/$SITE.json"
        env:
          # GitHub search answers nothing anonymously
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.site }}
          path: scans/
          retention-days: 1

  propose:
    name: Propose
    runs-on: ubuntu-24.04-arm
    needs: [scan]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    env:
      KIND: ${{ inputs.kind }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/*.py

      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: scans
          merge-multiple: true

      - name: update sources and open pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          shopt -s nullglob
          scans=(scans/*.json)
          [ "${#scans[@]}" -gt 0 ] || { echo "::warning::no scan finished"; exit 0; }

          file="data/$KIND/sources.json"
          branch="sources/$KIND-update"
          message="chore: update $KIND sources"
          note='> ##### This pr was automatically generated by [agents-nix-bot](https://github.com/apps/agents-nix-bot).'

          # a required check guards main, so this lands through a pull request
          for _ in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            uv run --script ci/scripts/qualify.py "$file" "${scans[@]}" |
              uv run --script ci/scripts/combine.py "$file"
            git diff --quiet -- "$file" && exit 0

            git push -q --force origin "HEAD:refs/heads/$branch"
            blob=$(git rev-parse --verify --quiet "HEAD:$file" || true)
            jq -n --arg message "$message" --arg branch "$branch" --arg sha "$blob" \
              --rawfile content "$file" \
              '{ message: $message, branch: $branch, content: ($content | @base64) }
                 + (if $sha == "" then { } else { sha: $sha } end)' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" --input - --silent || {
                echo "::notice::main moved while updating sources; working it out again"
                continue
              }

            open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            [ -n "$open" ] || gh pr create --head "$branch" --base main --title "$message" --body "$note" > /dev/null
            gh pr merge --auto --squash "$branch"
            exit 0
          done
          echo "::warning::main kept moving; leaving it to the next run"
