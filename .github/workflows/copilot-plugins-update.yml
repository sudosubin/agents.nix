name: Copilot Plugins Update

on:
  schedule:
    - cron: "8 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  update:
    name: Update
    uses: ./.github/workflows/update.yml
    with:
      kind: copilot-plugins
      shards: "[1, 2]"
    secrets: inherit
