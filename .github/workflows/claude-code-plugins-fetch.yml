name: Claude Code Plugins Fetch

on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: claude-code-plugins
      sites: '["claude-com", "github-topics", "marketplace-crawl"]'
      # marketplace-crawl reads the marketplace kind's committed snapshots
      data: data/claude-code-marketplaces
    secrets: inherit
