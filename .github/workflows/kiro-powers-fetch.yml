name: Kiro Powers Fetch

on:
  schedule:
    - cron: "52 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: kiro-powers
      sites: '["github-code", "github-topics"]'
    secrets: inherit
