name: Copilot Plugins Fetch

on:
  schedule:
    - cron: "38 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: copilot-plugins
      sites: '["marketplace-crawl", "github-topics"]'
      # marketplace-crawl reads the marketplace kind's committed snapshots
      data: data/copilot-marketplaces
    secrets: inherit
