name: Copilot Plugins Fetch

on:
  schedule:
    - cron: "37 4-23/6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # GitHub search is rate limited per token, which every site here shares
      max-parallel: 1
      matrix:
        site: [marketplace-crawl, github-topics]
    env:
      KIND: copilot-plugins
      SITE: ${{ matrix.site }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ci
            data/copilot-marketplaces

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/copilot-plugins-scan.py

      - name: scan the site
        run: uv run --script "ci/scripts/$KIND-scan.py" "$SITE" "scans/$SITE.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: scan-${{ matrix.site }}
          path: scans/
          retention-days: 1

  propose:
    name: Propose
    runs-on: ubuntu-24.04-arm
    needs: [scan]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: read
    env:
      KIND: copilot-plugins

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/*.py

      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: scans
          merge-multiple: true

      - name: update sources and open a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          scans=(scans/*.json)
          [ "${#scans[@]}" -gt 0 ] || { echo "::warning::no scan finished"; exit 0; }

          gh auth setup-git

          file="data/$KIND/sources.json"
          GH_TOKEN="$WORKFLOW_TOKEN" uv run --script ci/scripts/qualify.py "$file" scans/*.json |
            uv run --script ci/scripts/combine.py "$file" - |
            uv run --script ci/scripts/propose-sources.py update "$file"
