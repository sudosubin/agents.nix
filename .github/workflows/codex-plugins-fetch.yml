name: Codex Plugins Fetch

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: codex-plugins
      sites: '["marketplace-crawl", "github-code", "github-topics"]'
      # marketplace-crawl reads the marketplace kind's committed snapshots
      data: data/codex-marketplaces
    secrets: inherit
