name: Agent Skills Fetch

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: agent-skills
      sites: '["skills-sh", "skillsdirectory-com"]'
    secrets: inherit
