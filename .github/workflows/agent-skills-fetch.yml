name: Agent Skills Fetch

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site: [skills-sh, skillsdirectory-com]
    env:
      SITE: ${{ matrix.site }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/agent-skills-scan.py

      - name: scan the site
        run: uv run --script ci/scripts/agent-skills-scan.py "$SITE" "scans/$SITE.json"

      - uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.site }}
          path: scans/
          retention-days: 1

  combine:
    name: Combine
    runs-on: ubuntu-24.04-arm
    needs: [scan]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    env:
      KIND: agent-skills

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/combine.py

      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: scans
          merge-multiple: true

      - name: combine the scans
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          shopt -s nullglob
          scans=(scans/*.json)
          [ "${#scans[@]}" -gt 0 ] || { echo "::warning::no scan finished"; exit 0; }

          file="data/$KIND/sources.json"
          branch="sources/$KIND-update"
          message="chore: update $KIND sources"
          note='> ##### This pr was automatically generated by [agents-nix-bot](https://github.com/apps/agents-nix-bot).'

          # a required check guards main, so this lands through a pull request
          for _ in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            uv run --script ci/scripts/combine.py "$file" "${scans[@]}"
            git diff --quiet -- "$file" && exit 0

            git push -q --force origin "HEAD:refs/heads/$branch"
            blob=$(git rev-parse --verify --quiet "HEAD:$file" || true)
            jq -n --arg message "$message" --arg branch "$branch" --arg sha "$blob" \
              --rawfile content "$file" \
              '{ message: $message, branch: $branch, content: ($content | @base64) }
                 + (if $sha == "" then { } else { sha: $sha } end)' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" --input - --silent || {
                echo "::notice::main moved while combining; working it out again"
                continue
              }

            open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            [ -n "$open" ] || gh pr create --head "$branch" --base main --title "$message" --body "$note" > /dev/null
            gh pr merge --auto --squash "$branch"
            exit 0
          done
          echo "::warning::main kept moving; leaving it to the next run"
