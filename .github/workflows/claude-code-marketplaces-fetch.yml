name: Claude Code Marketplaces Fetch

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  sources:
    name: Sources
    uses: ./.github/workflows/sources.yml
    with:
      kind: claude-code-marketplaces
      sites: '["claudemarketplaces-com", "github-code", "github-topics"]'
    secrets: inherit
