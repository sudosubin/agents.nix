name: Website Deploy

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website-deploy.yml
  schedule:
    - cron: "33 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            data
            nix
            website

      - uses: actions/configure-pages@v6
        id: pages

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15
          cache-python: true
          cache-dependency-glob: website/scripts/build.py

      - name: build the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: uv run --script website/scripts/build.py --base "$BASE_PATH/" --out website/dist

      # repositories such as `.claude` render at their own dot paths
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm
    needs: [build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
