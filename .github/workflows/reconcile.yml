name: Reconcile

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [agent-skills]
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.kind }}
    env:
      KIND: ${{ matrix.kind }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/reconcile.py

      - name: reconcile the sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          file="data/$KIND/sources.json"

          # the api signs the commit; the blob it is written against is the compare-and-swap
          for _ in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            uv run --script ci/scripts/reconcile.py "$file"
            git diff --quiet -- "$file" && exit 0

            jq -n --arg message "chore: reconcile $KIND sources with github" \
              --arg sha "$(git rev-parse "HEAD:$file")" --rawfile content "$file" \
              '{ message: $message, branch: "main", sha: $sha, content: ($content | @base64) }' \
              | GH_TOKEN=$APP_TOKEN gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" \
                --input - --silent && exit 0

            echo "::notice::main moved while reconciling; working it out again"
          done
          echo "::warning::main kept moving; leaving it to the next run"
