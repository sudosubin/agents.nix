name: Reconcile

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [agent-skills]
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.kind }}
    env:
      KIND: ${{ matrix.kind }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/reconcile.py

      - name: reconcile the sources
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="data/$KIND/sources.json"
          branch="sources/$KIND-reconcile"
          message="chore: reconcile $KIND sources with github"
          note='> ##### This pr was automatically generated by [agents-nix-bot](https://github.com/apps/agents-nix-bot).'

          # a required check guards main, so this lands through a pull request
          for _ in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            GH_TOKEN=$WORKFLOW_TOKEN uv run --script ci/scripts/reconcile.py "$file"
            git diff --quiet -- "$file" && exit 0

            git push -q --force origin "HEAD:refs/heads/$branch"
            blob=$(git rev-parse --verify --quiet "HEAD:$file" || true)
            jq -n --arg message "$message" --arg branch "$branch" --arg sha "$blob" \
              --rawfile content "$file" \
              '{ message: $message, branch: $branch, content: ($content | @base64) }
                 + (if $sha == "" then { } else { sha: $sha } end)' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" --input - --silent || {
                echo "::notice::main moved while reconciling; working it out again"
                continue
              }

            open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            [ -n "$open" ] || gh pr create --head "$branch" --base main --title "$message" --body "$note" > /dev/null
            gh pr merge --auto --squash "$branch"
            exit 0
          done
          echo "::warning::main kept moving; leaving it to the next run"
