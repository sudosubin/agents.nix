name: Reconcile

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind:
          - agent-plugins
          - agent-skills
          - claude-code-marketplaces
          - claude-code-plugins
          - codex-marketplaces
          - codex-plugins
          - copilot-marketplaces
          - copilot-plugins
          - kiro-powers
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.kind }}
    env:
      KIND: ${{ matrix.kind }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: ci/scripts/*.py

      - name: reconcile the sources
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="data/$KIND/sources.json"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            if GH_TOKEN="$WORKFLOW_TOKEN" uv run --script ci/scripts/reconcile.py "$file" |
              uv run --script ci/scripts/propose-sources.py reconcile "$file"; then
              exit 0
            else
              status=$?
              [ "$status" -eq 75 ] || exit "$status"
            fi
          done
          echo "::error::could not reconcile sources after three attempts"
          exit 1
