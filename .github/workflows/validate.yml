name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          sparse-checkout: |
            ci
            nix

      - name: select checks
        id: changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          GIT_NO_LAZY_FETCH: 1
        run: |
          base=$(git rev-parse --verify --quiet "$BASE_REF^{commit}" || true)
          changed() { [ -n "$base" ] && git diff --quiet --no-renames "$base" HEAD -- "$@" && echo false || echo true; }
          workflow=.github/workflows/validate.yml
          {
            echo "base=$base"
            echo "python=$(changed ci "$workflow")"
            echo "sources=$(changed ':(glob)data/*/sources.json')"
            echo "nix=$(changed ci default.nix flake.lock flake.nix nix ':(glob)data/*/sources.json' "$workflow")"
            echo "snapshots=$(changed ':(glob)data/*/*/*/*.json')"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.changes.outputs.python == 'true' || steps.changes.outputs.sources == 'true'
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: |
            ci/lib/pyproject.toml
            ci/scripts/*.py

      - name: lint
        if: steps.changes.outputs.python == 'true'
        run: |
          uvx ruff@0.16.8 check ci
          uvx ruff@0.16.8 format --check ci

      - name: check types
        if: steps.changes.outputs.python == 'true'
        run: |
          uv sync --script ci/scripts/reconcile.py
          uvx ty@0.0.82 check --python "$(uv python find --script ci/scripts/reconcile.py)" ci/scripts ci/lib

      - name: check out the data
        if: steps.changes.outputs.nix == 'true'
        run: git sparse-checkout add data

      - name: check the sources
        if: steps.changes.outputs.sources == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
          GIT_NO_LAZY_FETCH: 1
        run: |
          git diff --no-renames --diff-filter=d --name-only "$BASE" HEAD -- ':(glob)data/*/sources.json' |
            xargs -r -d '\n' uvx check-jsonschema@0.38.2 --schemafile ci/schemas/sources.json

      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.snapshots == 'true'

      - name: evaluate the flake
        if: steps.changes.outputs.nix == 'true'
        run: |
          nix flake check path:. --no-build
          nix flake check path:./ci --all-systems --no-build
          for sources in data/*/sources.json; do
            kind=${sources#data/}
            nix eval --json "path:.#${kind%/sources.json}.aarch64-linux" --apply \
              'builtins.mapAttrs (_: builtins.mapAttrs (_: builtins.mapAttrs (_: builtins.attrNames)))' > /dev/null
          done

      - name: build snapshots
        if: steps.changes.outputs.snapshots == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          set -o pipefail
          changed=$(GIT_NO_LAZY_FETCH=1 git diff --no-renames --diff-filter=d --name-only "$BASE" HEAD -- ':(glob)data/*/*/*/*.json')
          [ -n "$changed" ] || exit 0
          xargs -d '\n' dirname -- <<< "$changed" | sort -u | xargs -d '\n' git sparse-checkout add --

          status=0
          while read -r file; do
            IFS=/ read -r _ kind host owner repo <<< "${file%.json}"
            forge=$(jq -r --arg host "$host" '.[$host] // $host' nix/forges.json)
            attr="path:.#$kind.aarch64-linux.\"$forge\".\"$owner\".\"$repo\""
            nix eval --json "$attr" --apply 'packages: builtins.map (p: p.drvPath) (builtins.attrValues packages)' |
              jq -r '.[]' |
              xargs -r -d '\n' nix build --no-link --print-build-logs --keep-going || status=1
          done <<< "$changed"
          exit "$status"
