name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          sparse-checkout: |
            ci
            nix

      - name: select checks
        id: changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          GIT_NO_LAZY_FETCH: 1
        run: |
          base=$(git rev-parse --verify --quiet "$BASE_REF^{commit}" || true)
          changed() { [ -n "$base" ] && git diff --quiet --no-renames "$base" HEAD -- "$@" && echo false || echo true; }
          workflow=.github/workflows/validate.yml
          {
            echo "base=$base"
            echo "python=$(changed ci "$workflow")"
            echo "sources=$(changed ':(glob)data/*/sources.json')"
            echo "nix=$(changed ci default.nix flake.lock flake.nix nix ':(glob)data/*/sources.json' "$workflow")"
            echo "snapshots=$(changed ':(glob)data/*/*/*/*.json')"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.changes.outputs.python == 'true' || steps.changes.outputs.sources == 'true'
        with:
          python-version: 3.15t
          cache-python: true
          cache-dependency-glob: |
            ci/lib/pyproject.toml
            ci/scripts/*.py

      - name: lint
        if: steps.changes.outputs.python == 'true'
        run: |
          uvx ruff@0.16.8 check ci
          uvx ruff@0.16.8 format --check ci

      - name: check types
        if: steps.changes.outputs.python == 'true'
        run: |
          status=0
          for script in ci/scripts/*.py; do
            uv sync --script "$script" &&
              python=$(uv python find --script "$script") &&
              uvx ty@0.0.82 check --python "$python" "$script" ci/lib || status=1
          done
          exit "$status"

      - name: check the sources
        if: steps.changes.outputs.sources == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/sources"
          GIT_NO_LAZY_FETCH=1 git diff --no-renames --diff-filter=d --name-only \
            "$BASE" HEAD -- ':(glob)data/*/sources.json' |
            while read -r file; do
              git show "HEAD:$file" > "$RUNNER_TEMP/sources/${file//\//-}"
            done
          uvx check-jsonschema@0.38.2 --schemafile ci/schemas/sources.json \
            "$RUNNER_TEMP"/sources/*

      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.snapshots == 'true'

      - name: evaluate the flake
        if: steps.changes.outputs.nix == 'true'
        run: |
          git sparse-checkout add data
          nix flake check path:. --no-build
          nix flake check path:./ci --all-systems --no-build
          nix eval --json path:.#agent-skills.aarch64-linux --apply \
            'builtins.mapAttrs (_: builtins.mapAttrs (_: builtins.mapAttrs (_: builtins.attrNames)))' > /dev/null

      - name: build snapshots
        if: steps.changes.outputs.snapshots == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          changed=$(GIT_NO_LAZY_FETCH=1 git diff --no-renames --name-only "$BASE" HEAD -- ':(glob)data/*/*/*/*.json')
          xargs -r -d '\n' -n1 dirname <<< "$changed" | sort -u | xargs -r git sparse-checkout add --
          failed=()

          declare -A forge
          while IFS=$'\t' read -r dir name; do forge[$dir]=$name; done \
            < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' nix/forges.json)

          while IFS=/ read -r _ kind host owner repo; do
            file="data/$kind/$host/$owner/$repo"
            [ -f "$file" ] || continue
            attr=${forge[$host]:-$host}
            root="path:.#$kind.aarch64-linux.\"$attr\".\"$owner\".\"${repo%.json}\""
            label="$kind.$attr.$owner.${repo%.json}"

            if ! drvs=$(nix eval --json "$root" --apply 'builtins.mapAttrs (_: d: d.drvPath)'); then
              failed+=("$label")
              continue
            fi

            while IFS= read -r -d '' skill && IFS= read -r -d '' drv; do
              title="$label.${skill//[$'\n\r']/}"
              echo "::group::$title"
              nix build --no-link --print-build-logs "$drv^out" || failed+=("$title")
              echo "::endgroup::"
            done < <(jq --raw-output0 'to_entries[] | (.key, .value)' <<< "$drvs")
          done <<< "$changed"

          [ "${#failed[@]}" -eq 0 ] || printf 'did not build: %s\n' "${failed[@]}"
          [ "${#failed[@]}" -eq 0 ]
