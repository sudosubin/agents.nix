[project]
name = "agents.nix"
version = "0.1.0"
description = "Shared library for the agents.nix CI scripts"
requires-python = ">=3.15"
dependencies = ["jsonyx==2.3.0", "urllib3>=2.5"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agents.nix"

[tool.ty.rules]
all = "error"
