<div class="overflow-x-auto" tabindex="0" role="region" aria-label="Owners starting with {{ letter.label }}">
<table class="tbl">
  <thead>
    <tr>
      <th scope="col">Owner</th>
      <th class="num" scope="col">Repositories</th>
      <th class="num" scope="col">Packages</th>
    </tr>
  </thead>
  <tbody>
    {% for owner in letter.owners %}
    <tr>
      <td><a href="{{ base }}{{ kind }}/{{ owner.forge }}/{{ owner.name }}/">{{ owner.name }}</a> <small class="text-muted">{{ owner.forge }}</small></td>
      <td class="num">{{ owner.repos | number }}</td>
      <td class="num">{{ owner.packages | number }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
